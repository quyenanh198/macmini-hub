name: macmini-hub

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest  # pin version khi deploy thật chạy ổn
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: "*"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 256m
    command: tunnel --no-autoupdate run
    environment:
      TZ: ${TZ}
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

  caddy:
    image: ghcr.io/quyenanh198/caddy-sablier:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  sablier:
    image: sablierapp/sablier:latest  # pin version khi deploy thật chạy ổn
    restart: unless-stopped
    mem_limit: 256m
    command: start --provider.name=docker
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  tts-studio:
    image: ghcr.io/quyenanh198/tts-studio:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 3g
    labels:
      - sablier.enable=true
      - sablier.group=tts
    environment:
      TZ: ${TZ}
      ENABLE_HEAVY_TTS: ${ENABLE_HEAVY_TTS}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/tts-models:/models
      - ${DATA_ROOT:?DATA_ROOT must be set}/tts-output:/output

  cadence2:
    image: ghcr.io/quyenanh198/cadence2:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - sablier.enable=true
      - sablier.group=cadence
    environment:
      TZ: ${TZ}

  stock-site:
    image: ghcr.io/quyenanh198/stock-site:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - sablier.enable=true
      - sablier.group=stock
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/stock-reports:/site/reports

  chat:
    image: ghcr.io/quyenanh198/chat:latest
    restart: unless-stopped
    mem_limit: 768m
    environment:
      TZ: ${TZ}
      SESSION_SECRET: ${CHAT_SESSION_SECRET:?CHAT_SESSION_SECRET must be set}
      BOOTSTRAP_INVITE: ${CHAT_BOOTSTRAP_INVITE:-}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/chat/db:/data/db
      - ${DATA_ROOT:?DATA_ROOT must be set}/chat/media:/data/media

name: macmini-hub

services:
  hub-ui:
    build: ./hub-ui
    image: macmini-hub/hub-ui:local
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      HUB_UI_TOKEN: ${HUB_UI_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT:?DATA_ROOT must be set}/stock-reports:/stockdata
    ports:
      - "3000:8090"

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/dozzle:/data
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 256m
    command: tunnel --no-autoupdate run
    environment:
      TZ: ${TZ}
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

  caddy:
    image: ghcr.io/quyenanh198/caddy-sablier:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  sablier:
    image: sablierapp/sablier:latest  # pin version khi deploy thật chạy ổn
    restart: unless-stopped
    mem_limit: 256m
    command: start --provider.name=docker
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  tts-studio:
    image: ghcr.io/quyenanh198/tts-studio:latest
    profiles: [fallback]   # native M4 là chính; container chỉ dùng khi cần fallback CPU
    restart: unless-stopped
    mem_limit: 3g
    labels:
      - sablier.enable=true
      - sablier.group=tts
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/tts-models:/models
      - ${DATA_ROOT:?DATA_ROOT must be set}/tts-output:/output

  cadence2:
    image: ghcr.io/quyenanh198/cadence2:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - sablier.enable=true
      - sablier.group=cadence
    environment:
      TZ: ${TZ}
      TTS_STUDIO_URL: http://host.docker.internal:8600

  stock-site:
    image: ghcr.io/quyenanh198/stock-site:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - sablier.enable=true
      - sablier.group=stock
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/stock-reports:/site/reports

  # Nông trại vui vẻ — game của cả nhà, sống ở chat.lazybutts.com/farm/*
  # (caddy route theo path, sablier đánh thức; xác thực mượn cookie của Chat).
  farm:
    image: ghcr.io/quyenanh198/ntvv:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 256m
    labels:
      - sablier.enable=true
      - sablier.group=farm
    environment:
      TZ: ${TZ}
      CHAT_API_URL: http://chat:8082
      FARM_INTERNAL_SECRET: ${FARM_INTERNAL_SECRET:-}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/farm:/data
    # Sablier dựa vào healthcheck để biết lúc nào farm thật sự sẵn sàng —
    # thiếu nó, vài giây đầu sau khi thức dậy vẫn trả trang chờ.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Idle Garden Hero — game idle vườn anh hùng, sống ở chat.lazybutts.com/garden/*.
  # Tiến trình lưu theo tài khoản Chat (server hỏi Chat /api/me bằng cookie lb_session),
  # nên đổi máy vẫn chơi tiếp. Ngủ/thức như farm: game idle tự tính phần "vắng mặt" ở
  # phía trình duyệt, lúc không ai mở thì container không cần chạy.
  garden:
    image: ghcr.io/quyenanh198/garden:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 128m
    labels:
      - sablier.enable=true
      - sablier.group=garden
    environment:
      TZ: ${TZ}
      CHAT_API_URL: http://chat:8082
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/garden:/data
    # Sablier đợi healthy mới thả request qua — thiếu nó, lúc vừa thức sẽ trả trang chờ.
    # start_interval: trong lúc khởi động hỏi mỗi giây, nên người mở game chỉ chờ ~1-2 giây
    # thay vì đợi tròn một nhịp 10 giây như trước.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8095/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  # VMahjong — mạt chược solitaire, tĩnh hoàn toàn (điểm lưu trên máy người
  # chơi), sống ở chat.lazybutts.com/mahjong/*, ngủ/thức như farm.
  mahjong:
    image: ghcr.io/quyenanh198/vmahjong:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 128m
    labels:
      - sablier.enable=true
      - sablier.group=mahjong
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      # 5s: sablier blocking chờ tới khi healthy — nginx tĩnh sẵn sàng gần như ngay.
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # Xếp Gạch (BlockPuzzle) — tetris tĩnh, sống ở chat.lazybutts.com/blockpuzzle/*,
  # ngủ/thức như mahjong.
  blockpuzzle:
    image: ghcr.io/quyenanh198/blockpuzzle:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 64m
    labels:
      - sablier.enable=true
      - sablier.group=blockpuzzle
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      # 5s: sablier blocking chờ tới khi healthy — nginx tĩnh sẵn sàng gần như ngay.
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # Musik — trình phát nhạc tự host, sống ở musik.lazybutts.com. Luôn chạy (không
  # sablier): đang phát nhạc nền trên điện thoại mà container ngủ thì bài kế tiếp
  # phải chờ đánh thức và dễ đứt. Nhạc + musik.db nằm ở ${DATA_ROOT}/musik.
  musik:
    image: ghcr.io/quyenanh198/musik:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      # Nút "From AudioExtract" trong Musik kéo file đã tách về (nội bộ docker).
      AUDIOEXTRACT_URL: http://audioextract:3000
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/musik:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AudioExtract — tách audio từ YouTube/Facebook/TikTok (yt-dlp + ffmpeg), sống ở
  # audioextract.lazybutts.com. Luôn chạy (không sablier): một lần tải có thể mất
  # vài phút không có request HTTP nào, sablier sẽ tưởng rảnh mà tắt giữa chừng.
  # File kết quả giữ 7 ngày trong ${DATA_ROOT}/audioextract/out rồi tự xoá.
  audioextract:
    image: ghcr.io/quyenanh198/audioextract:latest
    restart: unless-stopped
    mem_limit: 768m
    environment:
      TZ: ${TZ}
      MAX_PARALLEL_DOWNLOADS: "2"
      # Đẩy file vừa tách thẳng vào thư viện Musik (nội bộ docker, không qua Access).
      MUSIK_URL: http://musik:3000
      KEEP_DAYS: "7"
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/audioextract:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Gunny — webgame bắn tọa độ, sống ở gunny.lazybutts.com. Từ bản online-hoá,
  # server Node giữ trạng thái phòng/trận và stream qua WebSocket (/ws); luôn
  # chạy (không sablier) vì phiên WS không gia hạn sablier, nên một trận đang
  # diễn ra có thể bị ngắt giữa chừng nếu container ngủ sau 15 phút.
  # Bản R0-R8 thêm danh tính/ví/lịch sử trận trong PostgreSQL: image đặt
  # NODE_ENV=production nên server bắt buộc phải có DATABASE_URL (thiếu là crash
  # lúc khởi động), migration tự chạy trước khi mở cổng.
  # Không đặt TRUST_PROXY: clientIp() chỉ tin X-Forwarded-For từ IP proxy liệt kê
  # sẵn, mà IP container caddy đổi sau mỗi lần recreate. Hệ quả là mọi người chơi
  # dùng chung một IP (của caddy) cho rate limit, nên nới hạn mức lên mức gia đình
  # thay vì để mặc định 20 kết nối/240 request cho tất cả cộng lại.
  gunny:
    image: ghcr.io/quyenanh198/gunny:latest
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      gunny-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgres://gunny:${GUNNY_DB_PASSWORD:?GUNNY_DB_PASSWORD must be set}@gunny-db:5432/gunny
      METRICS_TOKEN: ${GUNNY_METRICS_TOKEN:?GUNNY_METRICS_TOKEN must be set}
      # Hai đường vào: subdomain riêng, và /gunny/* trong Chat (mượn đăng nhập ở đó).
      ALLOWED_ORIGINS: https://gunny.lazybutts.com,https://chat.lazybutts.com
      # Gunny hỏi Chat "cookie lb_session này là ai" để khỏi bắt đặt tên lại.
      CHAT_API_URL: http://chat:8082
      # Caddy đã cắt /gunny trước khi vào container; biến này chỉ để cookie phiên của
      # Gunny bó trong /gunny, không đi kèm mọi request sang Chat.
      BASE_PATH: /gunny
      MAX_CONNECTIONS_PER_IP: "200"
      HANDSHAKES_PER_MINUTE: "300"
      ROOM_CREATES_PER_MINUTE: "60"
      HTTP_REQUESTS_PER_MINUTE: "2000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  # PostgreSQL riêng cho Gunny (danh tính khách, ví/tiến trình, lịch sử trận,
  # log kiểm duyệt). Chỉ trong mạng nội bộ docker, không publish cổng ra ngoài.
  gunny-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      POSTGRES_USER: gunny
      POSTGRES_PASSWORD: ${GUNNY_DB_PASSWORD:?GUNNY_DB_PASSWORD must be set}
      POSTGRES_DB: gunny
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/gunny-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gunny -d gunny"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Worms — game bắn pháo theo lượt (3D, online), sống ở chat.lazybutts.com/worms/*
  # để dùng chung cookie `lb_session` của Chat. Image do repo Worms tự build (có sẵn
  # bản Web của Unity bên trong) nên deploy bằng pull, KHÔNG dùng --build:
  #   docker compose pull worms && scripts/deploy.sh worms
  # Không qua sablier (giống Gunny): phiên WebSocket giữ trạng thái trận, sablier có
  # thể tắt container giữa trận. Trạng thái trận chỉ ở trong RAM: deploy lúc đang có
  # trận thì trận đó mất, người chơi tự nối lại vào sảnh.
  worms:
    image: ghcr.io/quyenanh198/worms:latest
    restart: unless-stopped
    mem_limit: 384m
    environment:
      TZ: ${TZ}
      # Worms hỏi Chat "cookie lb_session này là ai" (GET /api/me), không có secret dùng chung.
      CHAT_API_URL: http://chat:8082
      # Trình duyệt chỉ được mở WebSocket từ trang của Chat; app native không gửi Origin.
      ALLOWED_ORIGINS: https://chat.lazybutts.com
      # GET /status?token=... để xem số phòng và kết nối; bỏ trống thì tắt.
      STATUS_TOKEN: ${WORMS_STATUS_TOKEN:-}
      # Vàng, đồ đã mua và trang phục theo tài khoản Chat (SQLite). Chỉ server Worms ghi file này.
      WORMS_DB: /data/worms.db
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/worms:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Noto — kho ghi chú markdown, sống ở noto.lazybutts.com, ngủ/thức như mahjong.
  # Ghi chú là file .md thật trong ${DATA_ROOT}/noto/vault trên Mac mini (server
  # Node trong image vừa trả trang vừa mở /api/vault), nên mọi thiết bị mở chung
  # một kho và dữ liệu được sao lưu như các app khác.
  noto:
    image: ghcr.io/quyenanh198/noto:latest
    profiles: [apps]
    restart: unless-stopped
    mem_limit: 192m
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/noto:/data
    labels:
      - sablier.enable=true
      - sablier.group=noto
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      # 5s: sablier blocking chờ tới khi healthy — nginx tĩnh sẵn sàng gần như ngay.
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  chat:
    image: ghcr.io/quyenanh198/chat:latest
    restart: unless-stopped
    mem_limit: 768m
    environment:
      TZ: ${TZ}
      SESSION_SECRET: ${CHAT_SESSION_SECRET:?CHAT_SESSION_SECRET must be set}
      BOOTSTRAP_INVITE: ${CHAT_BOOTSTRAP_INVITE:-}
      VAPID_PUBLIC_KEY: ${CHAT_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${CHAT_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:quyenanh198@gmail.com
      GIF_GIPHY_KEY: ${CHAT_GIPHY_KEY:-}
      FARM_INTERNAL_SECRET: ${FARM_INTERNAL_SECRET:-}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/chat/db:/data/db
      - ${DATA_ROOT:?DATA_ROOT must be set}/chat/media:/data/media

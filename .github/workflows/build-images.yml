name: build-images

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [tts-studio, cadence2, stock-site, chat, ntvv, vmahjong, blockpuzzle]
    steps:
      # No recursive submodule checkout: one private submodule would sink the
      # whole matrix. Each job inits only its own app; if that fails (private
      # repo the GITHUB_TOKEN can't read, or no submodule at all), the job
      # skips cleanly instead of failing.
      - uses: actions/checkout@v4

      - name: Init app submodule (skip if unreachable)
        id: guard
        run: |
          if git submodule update --init "apps/${{ matrix.app }}" && [ -f "apps/${{ matrix.app }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.app }} not buildable (private submodule or missing Dockerfile) — skipped"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.guard.outputs.present == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.guard.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.guard.outputs.present == 'true'
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/quyenanh198/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  build-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: caddy
          platforms: linux/arm64
          push: true
          tags: ghcr.io/quyenanh198/caddy-sablier:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

    - Stock Site:
        icon: mdi-chart-line
        href: https://stock.lazybutts.com/
        description: Stock analysis reports
        server: local
        container: macmini-hub-stock-site-1
        showStats: true
    - Chat:
        icon: mdi-chat-processing
        href: https://chat.lazybutts.com/
